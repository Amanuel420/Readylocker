{% extends 'base.html' %}
{% block title %}Add Locker{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white p-8 rounded-lg shadow-md border border-gray-200">
        <h1 class="text-2xl font-bold mb-2 text-gray-900">Add a Locker</h1>
        <p class="text-gray-600 mb-6">Adding to location: <span class="font-semibold">{{ location.name }}</span></p>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="text-xs text-red-600 mt-1">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="pt-4">
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
                    Add Locker Unit
                </button>
                <a href="{% url 'marketplace_dashboard' %}" class="block text-center mt-3 text-sm text-gray-500 hover:text-gray-700">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
