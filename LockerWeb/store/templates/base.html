<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Ready Locker - Secure Storage Solutions{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#c62828',
            secondary: '#1f2937',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">
  
  <header class="border-b border-gray-200 bg-white sticky top-0 z-50 shadow-sm">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex-shrink-0">
          <a href="{% url 'home' %}" class="text-2xl font-bold tracking-tight text-gray-900 hover:text-primary transition-colors">
            READY LOCKER
          </a>
        </div>
        <div class="hidden md:block">
          <div class="ml-10 flex items-baseline space-x-8">
            <a href="{% url 'home' %}" class="text-gray-700 hover:text-primary transition-colors font-medium">Home</a>
            <a href="{% url 'about' %}" class="text-gray-700 hover:text-primary transition-colors font-medium">About</a>
            
            {% if user.is_authenticated %}
                {% if user.customer.is_seller %}
                    <a href="{% url 'marketplace_dashboard' %}" class="text-blue-600 hover:text-blue-800 font-bold transition-colors">Seller Dashboard</a>
                {% endif %}
                
                <a href="{% url 'my_bookings' %}" class="text-gray-700 hover:text-primary transition-colors font-medium">My Bookings</a>
                <a href="{% url 'logout' %}" class="text-gray-700 hover:text-primary transition-colors font-medium">Logout</a>
            {% else %}
              <a href="{% url 'login' %}" class="text-gray-700 hover:text-primary transition-colors font-medium">Login</a>
              <a href="{% url 'register' %}" class="bg-primary hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">Sign Up</a>
            {% endif %}
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-grow">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-gray-200 bg-gray-50 mt-auto">
    <div class="max-w-7xl mx-auto px-4 py-8 text-center text-sm text-gray-600">
      <p>&copy; 2024 Ready Locker. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
